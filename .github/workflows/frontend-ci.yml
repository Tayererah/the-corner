name: Frontend CI — Build & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'evaluation/**'
      - '*.json'
      - '*.ts'
      - '*.mjs'
  pull_request:
    branches: [main]

jobs:
  build:
    name: Next.js Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api
          GEMINI_API_KEY: placeholder_key
        run: npm run build
